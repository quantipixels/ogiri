name: CodeQL
on:
  pull_request:
  push:
    branches: [ori]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
        with:
          languages: java-kotlin
          build-mode: manual
      - name: Compile library and standalone application for analysis
        run: |
          mvn --batch-mode --no-transfer-progress -Dmaven.test.skip=true -Dmaven.javadoc.skip=true install
          mvn --batch-mode --no-transfer-progress -f examples/spring-app/pom.xml -Dmaven.test.skip=true package
      - uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
